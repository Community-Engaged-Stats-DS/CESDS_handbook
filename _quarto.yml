  site-url: https://community-engaged-stats-ds.github.io/CESDS_handbook/ 
  repo-url: https://github.com/Community-Engaged-Stats-DS/CESDS_handbook
  author: "Claire Kelling, Laurie Baker, Emily Robinson, Tyler George, and XXX"
